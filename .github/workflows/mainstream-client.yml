name: Mainstream client native proof
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mainstream/**'
      - 'scripts/mainstream-ci/**'
      - '.github/workflows/mainstream-client.yml'
permissions:
  contents: read
concurrency:
  group: mainstream-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/mainstream-ci -v
      - run: python3 -m unittest discover -s mainstream -v
      - run: node --check mainstream/storage-audit.cjs && bash -n mainstream/Install.command
      - run: node --check scripts/mainstream-ci/startup.mjs && node --check scripts/mainstream-ci/update.mjs && node --check scripts/mainstream-ci/storage-seed.cjs
      - run: python3 scripts/mainstream-ci/package_installer.py out/mainstream-installer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mainstream-installer
          path: out/mainstream-installer/
          if-no-files-found: error
          retention-days: 14
  native:
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          architecture: ${{ matrix.arch }}
      - name: Update native Homebrew for cask pin/trust support
        if: matrix.arch == 'arm64'
        run: brew update
      - name: Build official app and exercise remote-outage startup
        run: python3 scripts/mainstream-ci/run_native.py --root "$RUNNER_TEMP/mainstream-proof" --update-cycle
      - name: Evidence (not a release-ready receipt)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mainstream-proof-${{ matrix.arch }}
          path: ${{ runner.temp }}/mainstream-proof/evidence/
          if-no-files-found: error
          retention-days: 7
