name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Successful main-branch native build run ID (all four targets)'
        type: string
        required: true
  workflow_run:
    workflows: ['Build standalone desktops']
    types: [completed]
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-hermes-desktop
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Validate the native CI receipt and fetch its verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run || github.event.workflow_run.id }}
        run: python3 scripts/ci_receipt.py --run "$BUILD_RUN"
      - name: Create draft, verify exact assets, then publish numbered Latest release
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib, json, pathlib, subprocess, sys
          sys.path.insert(0, str(pathlib.Path('scripts').resolve()))
          from ci_receipt import validate_release_order
          repo='frankhommers/hermes-desktop-builds'
          directory=pathlib.Path('out/release')
          manifest=json.loads((directory/'release-manifest.json').read_text())
          receipt=json.loads(pathlib.Path('out/build-receipt.json').read_text())
          pages=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases?per_page=100','--paginate','--slurp']))
          validate_release_order(manifest['version'],[release for page in pages for release in page])
          tag='v'+manifest['version']
          assets=sorted(p for p in directory.iterdir() if p.name!='RELEASE-NOTES.md')
          existing=subprocess.run(['gh','release','view',tag,'--repo',repo,'--json','apiUrl'],capture_output=True)
          if existing.returncode!=0:
              subprocess.run(['gh','release','create',tag,*map(str,assets),'--repo',repo,'--target',receipt['head_sha'],'--title',manifest['version'],'--notes-file',str(directory/'RELEASE-NOTES.md'),'--draft','--prerelease=false','--latest=false'],check=True)
          view=json.loads(subprocess.check_output(['gh','release','view',tag,'--repo',repo,'--json','apiUrl']))
          # Unpublished drafts do not resolve through the REST releases/tags endpoint.
          endpoint=view['apiUrl']
          assert endpoint.startswith(f'https://api.github.com/repos/{repo}/releases/')
          remote=json.loads(subprocess.check_output(['gh','api',endpoint]))
          assert remote['draft'] and not remote['prerelease'], 'Never overwrite a published release'
          assert remote['tag_name']==tag and remote['target_commitish']==receipt['head_sha']
          assert remote['body'].strip()==(directory/'RELEASE-NOTES.md').read_text().strip()
          assert {a['name']:a['size'] for a in remote['assets']}=={p.name:p.stat().st_size for p in assets}
          byname={a['name']:a for a in remote['assets']}
          for m in manifest['targets'].values():
              assert byname[m['archive']]['digest']=='sha256:'+m['sha256']
          for asset in assets:
              assert byname[asset.name]['digest']=='sha256:'+hashlib.sha256(asset.read_bytes()).hexdigest(), 'Uploaded asset digest mismatch: '+asset.name
          subprocess.run(['gh','release','edit',tag,'--repo',repo,'--draft=false','--prerelease=false','--latest=true'],check=True)
          final=json.loads(subprocess.check_output(['gh','api',endpoint]))
          assert not final['draft'] and not final['prerelease']
          latest=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/latest']))
          assert latest['id']==final['id'] and latest['tag_name']==tag
          print('Verified public release:',final['html_url'])
