name: Build standalone desktops
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Optional exact build-repository commit required by the updater'
        type: string
        required: false
  pull_request:
permissions:
  contents: read
concurrency:
  group: hermes-native-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse a raced updater dispatch
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python3 -c 'import os,re; expected=os.environ.get("EXPECTED_SHA", ""); assert not expected or (re.fullmatch("[0-9a-f]{40}",expected) and expected==os.environ["GITHUB_SHA"]), "Build revision changed after dispatch"'
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/asar-paths.test.mjs tests/macos-signing.test.mjs
  build:
    name: native-${{ matrix.platform }}-${{ matrix.arch }}
    if: github.event_name == 'workflow_dispatch'
    needs: scripts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: windows-2025
            platform: win32
            arch: x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          architecture: ${{ matrix.arch }}
      - name: Unit-test build tooling
        run: python3 -m unittest discover -s tests -v
      - name: ASAR path and signing regression tests
        run: node --test tests/asar-paths.test.mjs tests/macos-signing.test.mjs
      - name: Build, inspect, roundtrip, and launch native app
        run: python3 scripts/build.py --run --expected-platform ${{ matrix.platform }} --expected-arch ${{ matrix.arch }}
      - name: Verified standalone distribution and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Diagnostic logs (including failed builds)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failure-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/${{ matrix.platform }}-${{ matrix.arch }}/logs/
          if-no-files-found: warn
          retention-days: 7
